
name: CI Pipeline

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'README.md'
      - 'K8s/**'

  pull_request:
    branches:
      - main

jobs:

  # Stage 1: Build and Test
  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r Backend/requirements.txt
          pip install pytest

      - name: Build Python Application
        run: |
          python -m compileall -q Backend

      - name: Run Tests
        run: |
          pytest Backend/ -v


  # Stage 2: Code Quality Check
  code-quality:
    name: Code Quality Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install Flake8
        run: |
          python -m pip install --upgrade pip
          pip install flake8

      - name: Run Flake8
        run: |
          flake8 Backend/ \
            --count \
            --select=E9,F63,F7,F82 \
            --show-source \
            --statistics

          flake8 Backend/ \
            --count \
            --exit-zero \
            --max-complexity=10 \
            --max-line-length=127 \
            --statistics

  # Stage 3 & 4: DockerHub Login, Build and Push
  docker-build-and-push:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest

    needs:
      - build-and-test
      - code-quality

    # Execute only on push to main
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/qr-code-generator:${{ github.run_id }}
  
  update-newtag-in-helm-chart:
    name: Update Helm Chart with New Docker Tag
    runs-on: ubuntu-latest
    needs:
      - docker-build-and-push
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
            token: ${{ secrets.GITHUB_TOKEN }}

      - name: Update Helm Chart with New Docker Tag
        run: |
          NEW_TAG=${{ github.run_id }}
          sed -i "s/tag:.*/tag: ${NEW_TAG}/" helm/qr-code-generator-chart/values.yaml

      - name: Commit and Push Changes
        run: |
          git config --global user.name "Sai Divakar"
          git config --global user.email "saidivakar.navara@gmail.com"
          git add helm/qr-code-generator-chart/values.yaml
          git commit -m "Update Helm chart with new Docker tag: ${{ github.run_id }}"
          git push origin main
