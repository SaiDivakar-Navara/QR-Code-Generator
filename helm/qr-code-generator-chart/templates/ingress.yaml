apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: qr-code-generator-ingress
  namespace: qrcode
  annotations:
  
    nginx.ingress.kubernetes.io/rewrite-target: /
spec:
  ingressClassName: nginx
  rules:
    - host: qr-code-generator.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: qr-code-generator-service
                port:
                  number: 80
