apiVersion: apps/v1
kind: Deployment
metadata:
  name: qr-code-generator
  namespace: qrcode
  labels:
    app: qr-code-generator
spec:
  replicas: 1
  selector:
    matchLabels:
      app: qr-code-generator
  template:
    metadata:
      labels:
        app: qr-code-generator
    spec:
      containers:
      - name: qr-code-generator
        image: {{ .Values.image.repository }}:{{ .Values.image.tag }}
        ports:
        - containerPort: 8000
